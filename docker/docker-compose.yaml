services:
  fanuc_ros2:
    container_name: fanuc_ros2
    image: fanuc_ros2
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "../.git:/root/.git"
      - "../fanuc_ws:/root/fanuc_ws"
      - "../moveit_ws:/root/moveit_ws"
      - "../lerobot_ws:/root/lerobot_ws"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    tty: true
    privileged: true
