services:
  fanuc_ros2:
    container_name: fanuc_ros2
    image: fanuc_ros2
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "../src/fanuc_description:/root/ws_fanuc/src/fanuc_description"
      - "../src/fanuc_driver:/root/ws_fanuc/src/fanuc_driver"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    tty: true
    privileged: true
