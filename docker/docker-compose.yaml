services:
  fanuc_ros2:
    container_name: fanuc_ros2
    image: fanuc_ros2
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    tty: true
    privileged: true
