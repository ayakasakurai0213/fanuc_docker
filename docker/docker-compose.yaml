services:
  fanuc_ros2:
    container_name: fanuc_ros2
    image: fanuc_ros2
    ports:
      - "47998:47998/udp"
      - "49100:49100/tcp"
      - "48322:48322/tcp"
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "../.git:/root/.git"
      - "../fanuc_ws:/root/fanuc_ws"
      - "../moveit_ws:/root/moveit_ws"
      - "../lerobot_ws:/root/lerobot_ws"
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
      - "/dev/video2:/dev/video2"
      - "/dev/video3:/dev/video3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    tty: true
    privileged: true
